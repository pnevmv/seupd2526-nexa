# global config. per-language analyzer settings in config_<lang>.yml

# --- indexing ---

collectionPath: /Volumes/KINGSTON/collection_data.json
indexPath: "experiment/index"

# resolved relative to repo root or code/
languageDetectorModel: src/main/resources/langdetect-183.bin

# BERT embeddings for each publication. needs a service at embeddingsServiceUrl.
# off by default since the baseline searcher doesn't use pub_vector.
embeddingsEnabled: false
embeddingsServiceUrl: http://localhost:8080/process

# --- translation ---

translateNonEnglishPublicationsToEnglish: false
translateNonEnglishClaimsToEnglish: false

# provider: none | command | gemma
translationProvider: gemma
translationTargetLanguage: en

# used when provider=command. called as: <cmd> <sourceLang> <targetLang>
translationCommand:

# used when provider=gemma
translationServiceUrl: http://127.0.0.1:8080/translate

# --- query expansion ---

enableQueryExpansion: true
queryExpansionServiceUrl: http://127.0.0.1:8001/expand

# --- searching ---

# searchMode: lexical (BM25 only), semantic (Vector only), hybrid (BM25 + Vector)
searchMode: lexical

# claims JSON: array of {index, text, pubkey?}
# active preprocessed topics. Use the expanded path after running expand_claims.py.
topics: datasets/processed/queries/translated/fr_train_en_translated.json
expandedTopics: datasets/processed/queries/expanded/fr_train_en_translated_expanded.json

# runID doubles as the output filename
runID: nexa-fr-train-translated-expanded
runPath: runs

maxDocsRetrieved: 50

# --- reserved ---
# leftovers from the LongEval pipeline. kept as placeholders so we know the
# key names; uncomment + wire up when we need them.
#
# maxTokens: 50
# correctSpelling: false
# dictionary: false
# start: false
# highlight: false
# nGrams: false
# synonyms: false
# fuzzy: false
# phrase: false
# useWord2Vec: false
# prf: false
numOfDocsToRetrieveForPrf: 5
numOfTokenFromPrf: 4
# reRank: true
# reRankServiceUrl: http://127.0.0.1:8080/rerank
# numOfDocsToRerank: 100

# --- hybrid search weights ---
#lexical trust, if the alpha value is higher more lexical trust is done, if it is lower semantical trust
rrfAlpha: 0.6
#keep 60, proved to be the best value
rrfK: 60

# --- lexical query weights ---
phraseBoost: 1.5
fuzzyBoost: 0.7
titleBoost: 2.0
abstractBoost: 1.0

# --- custom additions ---
rrfAlphaShortQuery: 0.8
rrfAlphaLongQuery: 0.2
rerankAlpha: 0.6
bm25_k1: 1.2
bm25_b: 0.75

