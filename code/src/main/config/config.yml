# global config. per-language analyzer settings in config_<lang>.yml

# --- indexing ---

collectionPath: code/datasets/collection_data.json
indexPath: "code/experiment/index"

# resolved relative to repo root or code/
languageDetectorModel: src/main/resources/langdetect-183.bin

# BERT embeddings for each publication. needs a service at embeddingsServiceUrl.
# off by default since the baseline searcher doesn't use pub_vector.
embeddingsEnabled: false
embeddingsServiceUrl: http://localhost:8080/process

# --- translation ---

translateNonEnglishPublicationsToEnglish: false
translateNonEnglishClaimsToEnglish: false

# provider: none | command | gemma
translationProvider: gemma
translationTargetLanguage: en

# used when provider=command. called as: <cmd> <sourceLang> <targetLang>
translationCommand:

# used when provider=gemma
translationServiceUrl: http://127.0.0.1:8008/translate

# --- searching ---

# claims JSON: array of {index, text, pubkey?}
topics: code/datasets/en_train.json

# runID doubles as the output filename
runID: nexa-baseline
runPath: runs

maxDocsRetrieved: 1000

# --- reserved ---
# leftovers from the LongEval pipeline. kept as placeholders so we know the
# key names; uncomment + wire up when we need them.
#
# maxTokens: 50
# correctSpelling: false
# dictionary: false
# start: false
# highlight: false
# nGrams: false
# synonyms: false
# fuzzy: false
# phrase: false
# useWord2Vec: false
# prf: false
# numOfDocsToRetrieveForPrf: 5
# numOfTokenFromPrf: 4
# reRank: false
# reRankEndPoint: Local
# reRankHeuristic: false
# numOfDocsToRerank: 100
